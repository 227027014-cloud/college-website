<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Secure Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05080d;
            color: #e8f1f8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* BACKGROUND GRID */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.035) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        /* TOP BAR */

        .topbar {
            height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #182530;
            background: rgba(5,8,13,0.95);
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #00e5ff;
        }

        .secure-status {
            color: #62e6a8;
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #62e6a8;
            border-radius: 50%;
            margin-right: 7px;
            box-shadow: 0 0 10px #62e6a8;
        }

        /* MAIN */

        .login-container {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 30px;
        }

        .login-box {
            width: 430px;
            background: #080d14;
            border: 1px solid #233542;
            padding: 42px;
            box-shadow: 0 0 50px rgba(0,229,255,0.06);
            position: relative;
        }

        .login-box::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 30px;
            width: 80px;
            height: 2px;
            background: #00e5ff;
            box-shadow: 0 0 12px #00e5ff;
        }

        /* ICON */

        .shield {
            width: 58px;
            height: 58px;
            border: 1px solid #294452;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            margin-bottom: 25px;
            background: #0b141c;
        }

        .system-label {
            color: #00e5ff;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .description {
            color: #718394;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* FORM */

        label {
            display: block;
            color: #8ea0b0;
            font-size: 10px;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 47px;
            background: #05090e;
            border: 1px solid #263743;
            color: white;
            padding: 0 14px;
            margin-bottom: 20px;
            outline: none;
            font-size: 13px;
        }

        input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0,229,255,0.08);
        }

        input::placeholder {
            color: #465765;
        }

        /* SECURITY INFO */

        .security-info {
            display: flex;
            justify-content: space-between;
            color: #5f7383;
            font-size: 9px;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }

        .encrypted {
            color: #62e6a8;
        }

        /* BUTTON */

        button {
            width: 100%;
            height: 48px;
            border: none;
            background: #00e5ff;
            color: #031016;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        button:hover {
            background: #7cf2ff;
            box-shadow: 0 0 20px rgba(0,229,255,0.25);
        }

        /* FOOTER */

        .create-account {
            text-align: center;
            margin-top: 25px;
            color: #657787;
            font-size: 12px;
        }

        .create-account a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #526574;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .back:hover {
            color: #00e5ff;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .topbar {
                padding: 0 25px;
            }

            .secure-status {
                display: none;
            }

            .login-box {
                width: 100%;
                padding: 30px;
            }

            .login-container {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <header class="topbar">

        <div class="logo">
            🛡️ SENTINEL<span>X</span>
        </div>

        <div class="secure-status">
            <span class="dot"></span>
            SECURE CONNECTION
        </div>

    </header>


    <main class="login-container">

        <div class="login-box">

            <div class="shield">🛡️</div>

            <div class="system-label">
                SENTINELX // AUTHENTICATION
            </div>

            <h1>Command Center</h1>

            <p class="description">
                Authenticate your operator credentials to access
                the SentinelX security monitoring environment.
            </p>


            <form onsubmit="loginUser(event)">

                <label>OPERATOR ID</label>

                <input
                    type="text"
                    placeholder="Enter operator ID"
                    required
                >


                <label>SECURITY KEY</label>

                <input
                    type="password"
                    placeholder="Enter security key"
                    required
                >


                <div class="security-info">
                    <span class="encrypted">
                        ● END-TO-END ENCRYPTED
                    </span>

                    <span>
                        AUTH NODE: SX-01
                    </span>
                </div>


                <button type="submit">
                    AUTHENTICATE →
                </button>

            </form>


            <div class="create-account">
                New operator?
                <a href="register.html">Create Access</a>
            </div>

            <a href="index.html" class="back">
                ← RETURN TO COMMAND CENTER
            </a>

        </div>

    </main>


   <script>

function loginUser(event) {

    event.preventDefault();

    const operatorId = document.querySelectorAll("input")[0].value;
    const password = document.querySelectorAll("input")[1].value;

    const savedId = localStorage.getItem("operatorId");
    const savedPassword = localStorage.getItem("operatorPassword");

    if (operatorId === savedId && password === savedPassword) {

        alert("✓ Authentication Successful!");

        window.location.href = "dashboard.html";

    } else {

        alert("❌ Incorrect Operator ID or Security Key!");

    }
}

</script>

</body>
</html>
