<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelX | Operator Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05080d;
            color: #e8f1f8;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        .topbar {
            height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #182530;
            background: #070b11;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #00e5ff;
        }

        .status {
            color: #62e6a8;
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #62e6a8;
            border-radius: 50%;
            margin-right: 7px;
        }

        .container {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .register-box {
            width: 470px;
            background: #080d14;
            border: 1px solid #243542;
            padding: 38px;
            position: relative;
        }

        .register-box::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 30px;
            width: 90px;
            height: 2px;
            background: #00e5ff;
        }

        .label {
            color: #00e5ff;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 10px;
        }

        .intro {
            color: #718394;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            color: #8ea0b0;
            font-size: 10px;
            letter-spacing: 1.3px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            height: 45px;
            background: #05090e;
            border: 1px solid #263743;
            color: white;
            padding: 0 13px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #00e5ff;
        }

        .access-level {
            margin: 2px 0 20px;
            padding: 12px;
            border: 1px solid #1c303c;
            color: #687b8b;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .access-level span {
            color: #62e6a8;
        }

        button {
            width: 100%;
            height: 47px;
            border: none;
            background: #00e5ff;
            color: #031016;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        button:hover {
            box-shadow: 0 0 20px rgba(0,229,255,.25);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #647687;
            font-size: 12px;
        }

        .login-link a {
            color: #00e5ff;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #526574;
            text-decoration: none;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .register-box {
                width: 100%;
                padding: 28px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="logo">
        🛡️ SENTINEL<span>X</span>
    </div>

    <div class="status">
        <span class="dot"></span>
        SECURE REGISTRATION
    </div>

</header>


<main class="container">

    <div class="register-box">

        <div class="label">
            SENTINELX // OPERATOR REGISTRATION
        </div>

        <h1>Create Operator Access</h1>

        <p class="intro">
            Register a new security operator account
            for the SentinelX monitoring environment.
        </p>


        <form onsubmit="registerUser(event)">

            <div class="row">

                <div>
                    <label>OPERATOR NAME</label>
                    <input type="text" placeholder="Full name" required>
                </div>

                <div>
                    <label>OPERATOR ID</label>
                    <input type="text" placeholder="SX-XXXX" required>
                </div>

            </div>


            <label>EMAIL ADDRESS</label>
            <input type="email" placeholder="operator@email.com" required>


            <label>SECURITY KEY</label>
            <input type="password" placeholder="Create security key" required>


            <label>CONFIRM SECURITY KEY</label>
            <input type="password" placeholder="Confirm security key" required>


            <div class="access-level">
                DEFAULT ACCESS LEVEL:
                <span>OPERATOR / MONITORING</span>
            </div>


            <button type="submit">
                CREATE SECURE ACCESS →
            </button>

        </form>


        <div class="login-link">
            Already registered?
            <a href="login.html">Return to Login</a>
        </div>

        <a href="index.html" class="back">
            ← RETURN TO COMMAND CENTER
        </a>

    </div>

</main>


<script>

function registerUser(event) {

    event.preventDefault();

    const inputs = document.querySelectorAll("input");

    const name = inputs[0].value;
    const operatorId = inputs[1].value;
    const email = inputs[2].value;
    const password = inputs[3].value;
    const confirmPassword = inputs[4].value;

    if (password !== confirmPassword) {

        alert("❌ Security keys do not match!");

        return;
    }

    localStorage.setItem("operatorName", name);
    localStorage.setItem("operatorId", operatorId);
    localStorage.setItem("operatorEmail", email);
    localStorage.setItem("operatorPassword", password);

    alert("✓ Operator Access Created Successfully!");

    window.location.href = "login.html";
}

</script>
</body>
</html>
